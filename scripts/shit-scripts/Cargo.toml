[package]
name = "shit-scripts"
license.workspace = true
repository.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = []
# e2e = ["dep:ict-rs", "dep:sha2"]

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
# required-features = ["e2e"]

[[bin]]
name = "e2e"
path = "src/bin/e2e.rs"
required-features = ["e2e"]

[dependencies]
cw-shitstrap = { workspace = true, features = ["interface"] }
cw-shitstrap-factory = { workspace = true, features = ["interface"] }
cw-orch = { workspace = true, features = ["daemon"] }
cw-orch-interchain = { workspace = true, features = ["daemon"] }
cw-shit-denom = { workspace = true }
cosmwasm-std = { workspace = true }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = { workspace = true }
tracing = "0.1"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
serde_json = "1.0"

[dependencies.ict-rs]
path = "../../../ict-rs/ict-rs"
features = ["docker", "terp", "testing"]
# optional = true

